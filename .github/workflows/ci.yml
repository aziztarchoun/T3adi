name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:16-3.4
        ports:
          - 55432:5432
        env:
          POSTGRES_USER: roadsafety
          POSTGRES_PASSWORD: roadsafety_dev
          POSTGRES_DB: roadsafety
        options: >-
          --health-cmd "pg_isready -U roadsafety"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://roadsafety:roadsafety_dev@localhost:55432/roadsafety

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Run database migrations
        run: npm run db:migrate --workspace=apps/api

      - name: Test
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Build API container
        run: docker build -t t3adi-api:ci .
