services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: roadsafety
      POSTGRES_PASSWORD: roadsafety_dev
      POSTGRES_DB: roadsafety
    ports:
      - "5432:5432"
    volumes:
      - roadsafety_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadsafety"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  roadsafety_db_data:
